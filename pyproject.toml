[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minillm-runtime"
version = "0.2.0"
description = "A small PyTorch paged attention example"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "transformers==4.51.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["miniLLM*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
